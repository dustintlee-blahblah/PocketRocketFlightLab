# Publishes the "Pocket Rocket drag test" app (the app with the test drag model on by default, under its own name and
# application ID: android/app/build.gradle, build type dragtest) as a GitHub pre-release.
#
# To publish test build R: write R in android/dragtest-revision, commit and push to drag-model-test. On each push to
# that branch whose revision has no pre-release yet, the workflow builds the signed APK and publishes it as
# dragtest-v<version>-build<N>-<R> of that commit (GitHub creates the tag), N being the build of the released app the
# branch was last merged with. The pre-release is never marked latest, so .../releases/latest still gets the released
# app. The APK is signed with the release key (the same four secrets as release.yml), so each test build installs
# over the one before.

name: Drag test

on:
  push:
    branches: ["drag-model-test"]

permissions:
  contents: write

jobs:
  dragtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Which test build
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          N=$(grep -oE 'APP_BUILD = "[0-9]+"' src/js/core/start.js | grep -oE '[0-9]+')
          V=$(grep -oE 'versionName "[^"]+"' android/app/build.gradle | cut -d'"' -f2)
          R=$(tr -dc '0-9' < android/dragtest-revision)
          TAG="dragtest-v${V}-build${N}-${R}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Test build $R already has a pre-release ($TAG)."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v5
        if: steps.tag.outputs.exists == 'false'
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        if: steps.tag.outputs.exists == 'false'
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        if: steps.tag.outputs.exists == 'false'

      - name: Build the page
        if: steps.tag.outputs.exists == 'false'
        run: |
          npm ci
          node build.js

      - name: Build the signed drag-test APK
        if: steps.tag.outputs.exists == 'false'
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          GRADLE_TASK: assembleDragtest
          APK: app/build/outputs/apk/dragtest/app-dragtest.apk
        run: tools/build-release-apk.sh

      - name: Publish the pre-release
        if: steps.tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          NAME="PocketRocketDragTest-${TAG#dragtest-}.apk"
          mkdir out
          cp android/app/build/outputs/apk/dragtest/app-dragtest.apk "out/$NAME"
          {
            echo "A test build of Pocket Rocket Flight Lab that starts on the **test drag model** (Settings can switch it"
            echo "back to the released one). It installs beside the released app as \"Pocket Rocket drag test\" and keeps its"
            echo "own saved data. The test model is still being checked against measurements: see AERODYNAMICS.md on the"
            echo "drag-model-test branch. For the released app, use the latest release."
          } > notes.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Pocket Rocket drag test (${TAG#dragtest-})" --notes-file notes.md out/*
