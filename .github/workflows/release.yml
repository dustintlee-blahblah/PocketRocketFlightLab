# Publishes a GitHub release of Pocket Rocket Flight Lab when main gets a build number that has no release yet.
#
# To release build N:
#   node tools/set-build.js N          (APP_BUILD, the splash screen, the Android versionCode, package.json)
#   add "## Build N (date)" with its changes at the top of CHANGELOG.md
#   git commit -am "Build N" && git push
#
# On each push to main whose build number has no release yet, the workflow checks the source and build.gradle agree on it and
# the changelog has the build's notes, builds the page and the signed release APK, and publishes them as release
# v<version>-build<N> of that commit (GitHub creates the tag). The description is .github/release-template.md with the
# build's CHANGELOG.md section (tools/release-notes.js). The files:
#   PocketRocketFlightLab-v<version>-build<N>.apk    the signed Android app
#   pocket-rocket-flight-lab-v<version>-build<N>.html  the web version
#   PocketRocketFlightLab.apk                        the same APK, so .../releases/latest/download/PocketRocketFlightLab.apk
#                                                    always gets the newest one
# If that build already has a release, nothing is published. Run the workflow by hand (Actions > Release > Run
# workflow) to publish the build on main, or to update an existing release's description from CHANGELOG.md.
#
# Signing uses four repository secrets (Settings > Secrets and variables > Actions):
#   SIGNING_KEYSTORE_B64   the PKCS#12 keystore, base64-encoded
#   SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD
# tools/build-release-apk.sh checks the APK's certificate against RELEASE_CERT_SHA256 below, so a release can't go out
# signed with a different key (it wouldn't install over the app people already have). Forks: put your own there.

name: Release

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_CERT_SHA256: b7257a22718c1b8f09d242edd309c8c253f92cb9f89befbb3a719a204a68ce78

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Which build
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          N=$(grep -oE 'APP_BUILD = "[0-9]+"' src/js/core/start.js | grep -oE '[0-9]+')
          V=$(grep -oE 'versionName "[^"]+"' android/app/build.gradle | cut -d'"' -f2)
          TAG="v${V}-build${N}"
          { echo "tag=$TAG"; echo "version=$V"; echo "build=$N"; } >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Build $N already has a release ($TAG)."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the build number
        env:
          V: ${{ steps.tag.outputs.version }}
          N: ${{ steps.tag.outputs.build }}
        run: |
          set -euo pipefail
          grep -q "<span id=\"spbuild\">$N</span>" src/index.html || { echo "::error::the splash screen isn't build $N (run tools/set-build.js)"; exit 1; }
          grep -q "versionCode $N\$" android/app/build.gradle || { echo "::error::build.gradle's versionCode isn't $N (run tools/set-build.js)"; exit 1; }
          node tools/release-notes.js "$V" "$N" > /dev/null || { echo "::error::CHANGELOG.md has no \"## Build $N (date)\" section"; exit 1; }

      - uses: actions/setup-node@v5
        if: steps.tag.outputs.exists == 'false'
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        if: steps.tag.outputs.exists == 'false'
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        if: steps.tag.outputs.exists == 'false'

      - name: Build the page
        if: steps.tag.outputs.exists == 'false'
        run: |
          npm ci
          node build.js

      - name: Build the signed APK
        if: steps.tag.outputs.exists == 'false'
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: tools/build-release-apk.sh

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          V: ${{ steps.tag.outputs.version }}
          N: ${{ steps.tag.outputs.build }}
        run: |
          set -euo pipefail
          node tools/release-notes.js "$V" "$N" notes.md
          if [ "${{ steps.tag.outputs.exists }}" = "true" ]; then
            # an existing release: a run started by hand refreshes its description; a push leaves it alone
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
              echo "::notice::Release $TAG already exists; its description was updated from CHANGELOG.md."
            fi
            exit 0
          fi
          mkdir out
          cp android/app/build/outputs/apk/release/app-release.apk "out/PocketRocketFlightLab-v${V}-build${N}.apk"
          cp out/PocketRocketFlightLab-v${V}-build${N}.apk out/PocketRocketFlightLab.apk
          cp web/pocket-rocket-flight-lab.html "out/pocket-rocket-flight-lab-v${V}-build${N}.html"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "Pocket Rocket Flight Lab ${V} (build ${N})" --notes-file notes.md out/*
