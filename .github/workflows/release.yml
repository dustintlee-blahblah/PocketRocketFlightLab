# Publishes a GitHub release of Pocket Rocket Flight Lab, built here from the tagged commit.
#
# To release build N:
#   node tools/set-build.js N          (APP_BUILD, the splash screen and the Android versionCode)
#   add "### What's new in build N" at the top of RELEASE_NOTES.md
#   git commit -am "Build N" && git push
#   git tag v1.0-buildN && git push origin v1.0-buildN
#
# The workflow checks that the tag, the source and build.gradle agree on the build number, builds the page and the
# signed release APK, and publishes them with RELEASE_NOTES.md as the description:
#   PocketRocketFlightLab-v<version>-build<N>.apk    the signed Android app
#   pocket-rocket-flight-lab-v<version>-build<N>.html  the web version
#   PocketRocketFlightLab.apk                        the same APK, so .../releases/latest/download/PocketRocketFlightLab.apk
#                                                    always gets the newest one
# Running it again for a tag that already has a release only updates the description.
#
# Signing uses four repository secrets (Settings > Secrets and variables > Actions):
#   SIGNING_KEYSTORE_B64   the PKCS#12 keystore, base64-encoded
#   SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD
# tools/build-release-apk.sh checks the APK's certificate against RELEASE_CERT_SHA256 below, so a release can't go out
# signed with a different key (it wouldn't install over the app people already have). Forks: put your own there.

name: Release

on:
  push:
    tags: ["v*-build*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to (re)publish, e.g. v1.0-build279"
        required: true

permissions:
  contents: write

env:
  RELEASE_CERT_SHA256: b7257a22718c1b8f09d242edd309c8c253f92cb9f89befbb3a719a204a68ce78

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Which tag
        id: tag
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v([0-9][0-9.]*)-build([0-9]+)$ ]] || { echo "::error::$TAG isn't a v<version>-build<N> tag"; exit 1; }
          { echo "tag=$TAG"; echo "version=${BASH_REMATCH[1]}"; echo "build=${BASH_REMATCH[2]}"; } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Check the build number
        env:
          V: ${{ steps.tag.outputs.version }}
          N: ${{ steps.tag.outputs.build }}
        run: |
          set -euo pipefail
          grep -q "const APP_BUILD = \"$N\";" src/js/core/start.js || { echo "::error::src/js/core/start.js isn't build $N (run tools/set-build.js)"; exit 1; }
          grep -q "<span id=\"spbuild\">$N</span>" src/index.html || { echo "::error::the splash screen isn't build $N"; exit 1; }
          grep -q "versionCode $N\$" android/app/build.gradle || { echo "::error::build.gradle's versionCode isn't $N"; exit 1; }
          grep -q "versionName \"$V\"" android/app/build.gradle || { echo "::error::build.gradle's versionName isn't $V"; exit 1; }
          grep -q "^### What's new in build $N\$" RELEASE_NOTES.md || { echo "::error::RELEASE_NOTES.md has no \"### What's new in build $N\""; exit 1; }

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the page
        run: node build.js

      - name: Build the signed APK
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: tools/build-release-apk.sh

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          V: ${{ steps.tag.outputs.version }}
          N: ${{ steps.tag.outputs.build }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file RELEASE_NOTES.md
            echo "::notice::Release $TAG already exists; only its description was updated."; exit 0
          fi
          mkdir out
          cp android/app/build/outputs/apk/release/app-release.apk "out/PocketRocketFlightLab-v${V}-build${N}.apk"
          cp out/PocketRocketFlightLab-v${V}-build${N}.apk out/PocketRocketFlightLab.apk
          cp web/pocket-rocket-flight-lab.html "out/pocket-rocket-flight-lab-v${V}-build${N}.html"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --latest \
            --title "Pocket Rocket Flight Lab ${V} (build ${N})" --notes-file RELEASE_NOTES.md out/*
