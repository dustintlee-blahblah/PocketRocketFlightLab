# Checks every push and every pull request: formatting, lint, the regression, smoke and save-and-reopen tests, the drag benchmarks,
# the phone-size walkthrough (its light and dark screenshots kept for 7 days as the walkthrough-screenshots artifact when
# a test fails),
# and that the Android app builds.

name: Check

on:
  push:
    branches-ignore: ["release-files"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Format, lint and tests
    # Playwright 1.56 supports Chromium up to Ubuntu 24.04
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: |
          npm ci
          npx playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Regression test (built-in examples against tests/golden-snapshot.json)
        run: npm test

      - name: UI smoke test (tabs, controls, builder; fails on any page error)
        run: node tests/smoke.js

      - name: Save and reopen test (every builder part and field survives the app's own save and open)
        run: node tests/roundtrip.js

      - name: Drag from an altimeter's accelerometer, and the drag hints
        run: node tests/coast.js

      - name: Altimeter logs, display readings and Flight vs prediction
        run: node tests/altimeter-logs.js

      - name: Drag benchmarks (NACA wind-tunnel and free-flight data)
        run: npm run test:drag

      - name: Inputs drive the outputs (Range, Motor and builder fields; strange values leave nothing broken)
        run: node tests/inputs.js

      - name: Exports read back (PDF report, flight data CSV, Flight Log backup and CSV, Save a copy)
        run: node tests/exports.js

      - name: Walkthrough at phone size (every screen in light and dark; no errors, nothing too wide, no blank chart)
        run: node tests/walkthrough.js

      - name: Keep the walkthrough's screenshots
        # only when something failed: that's when they're worth looking at, and they'd only take up storage otherwise
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: walkthrough-screenshots
          path: |
            test-results/walkthrough
            test-results/exports
          if-no-files-found: ignore
          retention-days: 7

      - name: Keep the built page
        uses: actions/upload-artifact@v4
        with:
          name: pocket-rocket-flight-lab-html
          path: web/pocket-rocket-flight-lab.html
          retention-days: 7

  android:
    name: Android app builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the page
        run: |
          npm ci
          node build.js
          node tools/build-step-kernel.js

      - name: Build the app (debug)
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Keep the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      # only where the signing secrets exist (this repository, not forks or pull requests from them): catches signing
      # problems before a release does
      - name: Build the signed release APK
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "No signing secrets here; skipped."; exit 0; fi
          tools/build-release-apk.sh
