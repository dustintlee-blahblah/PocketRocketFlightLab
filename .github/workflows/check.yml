# Checks every push and every pull request: formatting, lint, the regression test, the drag benchmarks,
# and that the Android app builds.

name: Check

on:
  push:
    branches-ignore: ["release-files"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Format, lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Regression test (built-in examples against tests/golden-snapshot.json)
        run: npm test

      - name: Drag benchmarks (NACA wind-tunnel and free-flight data)
        run: npm run test:drag

      - name: Keep the built page
        uses: actions/upload-artifact@v4
        with:
          name: pocket-rocket-flight-lab-html
          path: web/pocket-rocket-flight-lab.html

  android:
    name: Android app builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the page
        run: node build.js

      - name: Build the app (debug)
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Keep the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # only where the signing secrets exist (this repository, not forks or pull requests from them): catches signing
      # problems before a release does
      - name: Build the signed release APK
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "No signing secrets here; skipped."; exit 0; fi
          tools/build-release-apk.sh
