name: Feature request
description: Something you'd like the app to do.
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: What you want to do
      description: The task or question you have at the field or at the bench, rather than a particular solution.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: Another program, a workaround, by hand?
  - type: textarea
    id: idea
    attributes:
      label: Ideas for how it could work
